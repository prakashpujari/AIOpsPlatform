version: '3.8'

services:
  vllm:
    image: vllm/vllm:latest
    container_name: vllm-server
    ports:
      - "8080:80"
    environment:
      - VLLM_MODEL=llama3.3-70b
    # Add any required VLLM configuration here

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    # Ollama defaults are sufficient for local testing

  tgi:
    image: ghcr.io/huggingface/text-generation-inference:latest
    container_name: tgi-server
    ports:
      - "8081:8080"
    environment:
      - MODEL_ID=meta-llama/Meta-Llama-3.1-8B-Instruct
    # Adjust MODEL_ID to a suitable model available in the container image

  ai-gateway:
    build: ../apps/ai-gateway
    container_name: ai-gateway
    ports:
      - "8001:8001"
    environment:
      - VLLM_BASE_URL=http://vllm:80
      - OLLAMA_BASE_URL=http://ollama:11434
      - TGI_BASE_URL=http://tgi:8080
      - API_KEY=changeme
    depends_on:
      - vllm
      - ollama
      - tgi