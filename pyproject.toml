[tool.poetry]
name = "enterprise-ai-platform"
version = "1.0.0"
description = "Enterprise Banking AI Support Copilot & AIOps Platform"
authors = ["Platform Team <platform@bank.internal>"]
readme = "README.md"
python = "^3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "C4", "RUF"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["apps", "agents"]
omit = ["*/tests/*", "*/migrations/*"]
