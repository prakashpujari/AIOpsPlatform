version: "3.9"

# ─────────────────────────────────────────────
# Enterprise Banking AI Platform — Local Stack
# ─────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-policy
  restart: unless-stopped

services:

  # ── Databases ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *restart-policy
    environment:
      POSTGRES_DB: aiops_platform
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrate/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    <<: *restart-policy
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Kafka ──────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    <<: *restart-policy
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    <<: *restart-policy
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ── Vector DB ──────────────────────────────
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    <<: *restart-policy
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus_etcd:/etcd
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    logging: *default-logging

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    <<: *restart-policy
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging

  milvus:
    image: milvusdb/milvus:v2.4.6
    <<: *restart-policy
    command: ["milvus", "run", "standalone"]
    depends_on:
      - milvus-etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging

  # ── Auth ───────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    <<: *restart-policy
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-aiops}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    command: start-dev
    logging: *default-logging

  # ── Object Store ───────────────────────────
  minio:
    image: minio/minio:latest
    <<: *restart-policy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging

  # ── Secrets ────────────────────────────────
  vault:
    image: hashicorp/vault:1.16
    <<: *restart-policy
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    logging: *default-logging

  # ── Observability ──────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    <<: *restart-policy
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.0.0
    <<: *restart-policy
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    logging: *default-logging

  loki:
    image: grafana/loki:3.0.0
    <<: *restart-policy
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:1.57
    <<: *restart-policy
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    <<: *restart-policy
    depends_on:
      - jaeger
      - prometheus
    volumes:
      - ./observability/opentelemetry/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4319:4317"
      - "4320:4318"
      - "8888:8888"
    logging: *default-logging

  # ── Applications ───────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    <<: *restart-policy
    depends_on:
      - postgres
      - redis
      - kafka
      - milvus
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aiops_platform
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      KEYCLOAK_URL: http://keycloak:8080
      AI_GATEWAY_URL: http://ai-gateway:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src:ro
    logging: *default-logging

  ai-gateway:
    build:
      context: ./apps/ai-gateway
      dockerfile: Dockerfile
      target: development
    <<: *restart-policy
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aiops_platform
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ENV: development
    ports:
      - "8001:8001"
    volumes:
      - ./apps/ai-gateway/src:/app/src:ro
    logging: *default-logging

  ingestion:
    build:
      context: ./apps/ingestion
      dockerfile: Dockerfile
      target: development
    <<: *restart-policy
    depends_on:
      - postgres
      - kafka
      - milvus
      - minio
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aiops_platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ENV: development
    ports:
      - "8002:8002"
    volumes:
      - ./apps/ingestion/src:/app/src:ro
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    <<: *restart-policy
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_GATEWAY_URL: http://localhost:8001
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: aiops-platform
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: web-client
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src:ro
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  milvus_data:
  milvus_etcd:
  milvus_minio:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  default:
    name: aiops-network
