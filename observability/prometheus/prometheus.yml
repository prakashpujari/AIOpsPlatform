global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aiops-platform
    environment: development

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: aiops-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: ai-gateway
    static_configs:
      - targets: ["ai-gateway:8001"]
    metrics_path: /metrics

  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:8002"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: milvus
    static_configs:
      - targets: ["milvus:9091"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
